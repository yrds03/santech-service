<!DOCTYPE html>
<html lang="id">
<head>
   <title>Login - SANTECH SERVICE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F172A">
    <link rel="apple-touch-icon" href="sanstechservice.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-header {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="login-header">
                        <h3 class="mb-0">SANTECH SERVICE</h3>
                        <small>Sistem Manajemen Bengkel</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2">
                                <span id="btnText">Masuk</span>
                                <span id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </form>
                        <div id="alertBox" class="alert alert-danger mt-3 d-none" role="alert"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika Login -->
    <script>
        // TARUH URL DEPLOY GOOGLE APPS SCRIPT ANDA DI BAWAH INI
        const API_URL = "https://script.google.com/macros/s/AKfycbyU5XBt076eZuFxWmfmI57Av_XazxpYFm_TEftCAZbRGyRXP7D_2NLnwwNU-7y7RTw0/exec";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // UI State: Loading
            document.getElementById('btnText').classList.add('d-none');
            document.getElementById('btnLoading').classList.remove('d-none');
            document.getElementById('btnLogin').disabled = true;
            document.getElementById('alertBox').classList.add('d-none');

            // Payload untuk dikirim ke Apps Script
            const payload = {
                action: "loginUser",
                data: {
                    username: user,
                    password: pass
                }
            };

            // Fetch API (POST)
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(res => {
                if(res.status === "success") {
                    // Simpan sesi user di Local Storage browser
                    localStorage.setItem('user_session', JSON.stringify(res.user_data));
                    
                    // Pindah ke halaman Dashboard
                    window.location.href = "dashboard.html"; 
                } else {
                    showError(res.message);
                }
            })
            .catch(err => {
                showError("Gagal terhubung ke server. Periksa koneksi internet.");
            });
        });

        function showError(msg) {
            document.getElementById('alertBox').innerText = msg;
            document.getElementById('alertBox').classList.remove('d-none');
            document.getElementById('btnText').classList.remove('d-none');
            document.getElementById('btnLoading').classList.add('d-none');
            document.getElementById('btnLogin').disabled = false;
        }

        // Cek jika sudah login, langsung lempar ke dashboard
        if(localStorage.getItem('user_session')) {
            window.location.href = "dashboard.html";
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('ServiceWorker registered dengan sukses!');
                })
                .catch(err => {
                    console.log('ServiceWorker gagal didaftarkan: ', err);
                });
            });
        }
    </script>
</body>
</html>
